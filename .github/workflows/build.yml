name: build

on:
  push:
    # main builds :latest (what gpu-server and every new pod pull). A test/** branch builds the
    # same image as :<sha> and :<branch, '/' replaced by '-'> (test/comfy035 -> :test-comfy035), never
    # :latest, so an image change can be tried on a worker before main moves.
    branches: [main, 'test/**']
    # Only what goes into the image. A README or scripts/ edit is not worth a ten minute build.
    paths:
      - Dockerfile
      - install-node.sh
      - models.txt
      - download-models.sh
      - start.sh
      - agent.sh
      - nginx.conf.template
      - live.py
      - patches/**
      - app/**
      - .github/workflows/build.yml
  workflow_dispatch:

# GHCR names must be lowercase, so the repo name (ImageLabDocker) cannot be the image name.
env:
  IMAGE: ghcr.io/angelmankel/imagelab-pod

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (the torch + CUDA image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags (main -> :latest + :<sha>; any other branch -> :<branch slug> + :<sha>)
        id: tags
        run: |
          {
            echo 'list<<EOF'
            echo "$IMAGE:$GITHUB_SHA"
            if [ "$GITHUB_REF" = refs/heads/main ]; then
              echo "$IMAGE:latest"
            else
              echo "$IMAGE:${GITHUB_REF_NAME//\//-}"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
