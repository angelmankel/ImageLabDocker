name: build

on:
  push:
    branches: [main]
    # Only what goes into the image. A README or scripts/ edit is not worth a ten minute build.
    paths:
      - Dockerfile
      - install-node.sh
      - models.txt
      - download-models.sh
      - start.sh
      - nginx.conf.template
      - live.py
      - app/**
      - .github/workflows/build.yml
  workflow_dispatch:

# GHCR names must be lowercase, so the repo name (ImageLabDocker) cannot be the image name.
env:
  IMAGE: ghcr.io/angelmankel/imagelab-pod

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (the torch + CUDA image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
